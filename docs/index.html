<script>
/* アクセス解析（Google アナリティクス）。mataasobo.com だけで動かし、自分の閲覧は数えない
   自分の閲覧：一度 ?me を付けて開くと、このブラウザは数えなくなる（?me=off で戻す。mataasobo.com のどのページでも同じ） */
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
(function(){
  let me=false;
  try{const q=new URLSearchParams(location.search);
    if(q.has('me')){const off=q.get('me')==='off';if(off)localStorage.removeItem('mataasobo-me');else localStorage.setItem('mataasobo-me','1');
      alert(off?'このブラウザも数えるように戻しました':'このブラウザでの閲覧は、もう数えません')}
    me=!!localStorage.getItem('mataasobo-me')}catch(e){}
  if(me||location.hostname!=='mataasobo.com')return;
  const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-E7FT1414CV';document.head.appendChild(s);
  gtag('js',new Date());gtag('config','G-E7FT1414CV');
})();
</script>

<style>
/* Layout: a single column "投票用紙" feed — each お題 is a slip; picking reveals the tally as colored bars. Compose sheet lives in a second tab. */
:root{
  --bg:#eceef5; --sheet:#ffffff; --ink:#1b2033; --soft:#5b6380; --line:#d3d7e6;
  --accent:#2f54eb; --on-accent:#ffffff; --warn:#c7372f;
  --c1:#2f54eb; --c2:#e8590c; --c3:#0c9b6b; --c4:#b23ad1; --c5:#d6a20b; --c6:#e0457b;
  --display:"RocknRoll One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151f; --sheet:#1d2130; --ink:#eef0f8; --soft:#9aa1bd; --line:#33384d;
  --accent:#7d97ff; --on-accent:#0f1222; --warn:#ff7b72;
  --c1:#7d97ff; --c2:#ff8c4a; --c3:#3fd0a0; --c4:#d47ff0; --c5:#f2c94c; --c6:#ff7aa6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151f; --sheet:#1d2130; --ink:#eef0f8; --soft:#9aa1bd; --line:#33384d;
  --accent:#7d97ff; --on-accent:#0f1222; --warn:#ff7b72;
  --c1:#7d97ff; --c2:#ff8c4a; --c3:#3fd0a0; --c4:#d47ff0; --c5:#f2c94c; --c6:#ff7aa6; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.6}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,10vw,3rem);line-height:1.05;margin:0}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0;color:var(--soft);font-size:.95rem}
.tabs{display:flex;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;font:inherit;font-weight:700;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--soft);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:flex;gap:4px}
.pill{font:inherit;font-size:.85rem;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--soft);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.count{font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--soft);letter-spacing:.04em}
.qtext{font-weight:900;font-size:1.2rem;line-height:1.45;margin:0;text-wrap:balance;word-break:break-word}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{position:relative;overflow:hidden;font:inherit;font-weight:700;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.ch:hover{border-color:var(--c)}
.ch .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.ch .lbl{flex:1;min-width:0;word-break:break-word;position:relative}
.ch .pct{flex:none;font-variant-numeric:tabular-nums;font-weight:900;position:relative}
.ch .fill{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.16;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ch.mine{border-color:var(--c)}
.ch.mine .fill{opacity:.28}
.ch .you{font-size:.72rem;font-weight:900;color:var(--c);letter-spacing:.06em;position:relative;flex:none}
.done-note{font-size:.85rem;color:var(--soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qmeta .right{display:flex;gap:10px;align-items:center}
.rep{font:inherit;font-size:.75rem;background:none;border:0;color:var(--soft);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.rep:hover{color:var(--warn)}
.repbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;background:var(--bg);border-radius:10px;padding:10px 12px}
.repbox b{flex:1 1 12em;min-width:0}
.repbox button{font:inherit;font-weight:700;font-size:.82rem;padding:6px 12px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.repbox .go{background:var(--warn);border-color:var(--warn);color:#fff}
.share{display:flex;flex-wrap:wrap;gap:8px}
.share a,.share button{font:inherit;font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.share .x{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.focus-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--soft)}
.card.focus{border:2px solid var(--accent)}
.linkbtn{font:inherit;font-size:.82rem;background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;padding:0}
.empty{background:var(--sheet);border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--display);font-weight:400;font-size:1.3rem}
/* compose */
form{display:flex;flex-direction:column;gap:14px}
.f{font-size:.8rem;font-weight:900;color:var(--soft);letter-spacing:.08em}
textarea,input[type=text]{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:4.2em;font-size:1.05rem}
.opt{display:flex;gap:8px;align-items:center}
.opt .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.opt .x{flex:none;width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--soft);font:inherit;font-size:1rem;cursor:pointer} /* 選択肢を消すボタン（シェアの .x とは別） */
.opt .x:disabled{opacity:.35;cursor:default}
.btn{font-family:var(--display);font-weight:400;font-size:1.1rem;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.ghost{font:inherit;font-weight:700;padding:9px 12px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--soft);cursor:pointer}
.hint{font-size:.8rem;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.status{font-size:.92rem;border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;gap:8px}
.status.ng{color:var(--warn)}
.status.ok{color:var(--c3)}
.notice{font-size:.85rem;color:var(--soft);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ch .fill{transition:none}}
.foot{text-align:center;font-size:.8rem;color:var(--soft);margin:8px 0 0}
.foot a{color:inherit}
/* 答えくらべ：自分の答えをリンクにして友達に送る。友達は同じお題に答えて、一致率が出る */
.cmpbox{background:var(--sheet);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.cmpbox h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0}
.cmpbox p{margin:0;font-size:.9rem;color:var(--soft)}
.cmprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmprow input{flex:1 1 10em;width:auto}
.cmprow .btn{padding:10px 16px;font-size:1rem}
.cmplink{font-size:.8rem;word-break:break-all;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--soft)}
.ch .them{font-size:.72rem;font-weight:900;color:var(--ink);background:var(--bg);border-radius:999px;padding:1px 8px;position:relative;flex:none}
.match{font-family:var(--display);font-weight:400;font-size:1.1rem;text-align:center;margin:0}
.match.same{color:var(--c3)}.match.diff{color:var(--c2)}
.rate{font-family:var(--display);font-weight:400;font-size:clamp(3rem,16vw,4.5rem);line-height:1;text-align:center;margin:4px 0;color:var(--accent);font-variant-numeric:tabular-nums}
.difflist{margin:0;padding-left:1.2em;font-size:.88rem;display:grid;gap:6px}
.difflist b{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>みんなの<em>〇</em>択</h1>
    <p class="sub">正解のない質問に答えて、みんながどれを選んだか見てみよう。お題は誰でも作れます。</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-play" aria-selected="true" type="button">答える</button>
    <button class="tab" role="tab" id="t-make" aria-selected="false" type="button">お題をつくる</button>
  </div>

  <div id="notice" class="notice" hidden></div>

  <section id="v-play" style="display:flex;flex-direction:column;gap:14px">
    <div class="bar-row">
      <div class="seg" id="sorts">
        <button class="pill" type="button" data-s="todo" aria-pressed="true">まだ答えてない</button>
        <button class="pill" type="button" data-s="new" aria-pressed="false">新着</button>
        <button class="pill" type="button" data-s="hot" aria-pressed="false">人気</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="feed" id="feed">
      <div class="empty"><b>読み込み中…</b></div>
    </div>
  </section>

  <section id="v-make" hidden>
    <div class="card">
      <form id="form" novalidate>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label class="f" for="qin">質問</label>
          <textarea id="qin" maxlength="80" placeholder="例：無人島にひとつだけ持っていくなら？"></textarea>
          <div class="hint" id="qlen">0 / 80</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="f">選択肢（2〜6個）</span>
          <div id="opts" style="display:flex;flex-direction:column;gap:8px"></div>
          <button class="ghost" type="button" id="addopt">＋ 選択肢をふやす</button>
        </div>
        <div id="mstatus" class="status" hidden></div>
        <button class="btn" type="submit" id="send">AIにチェックしてもらって投稿</button>
        <p class="sub" style="font-size:.82rem">投稿前に、質問と選択肢をAIが確認します。悪口・個人情報・性的な内容・意味のない文字列などは載せられません。</p>
      </form>
    </div>
  </section>
  <p class="foot"><a href="/">また遊ぼ</a>・<a href="/privacy.html">プライバシーポリシー</a></p>
</div>

<script>
/* ↓ Supabase の Edge Function の URL に書き換える（末尾の / なし） */
const API="https://bhnkfafrnrddtkdkwvso.supabase.co/functions/v1/minna";

const COLORS=["--c1","--c2","--c3","--c4","--c5","--c6"];
const $=id=>document.getElementById(id);
const st={questions:[],mine:{},sort:"todo",revealed:new Set(),focus:new URLSearchParams(location.search).get("q")};
const BASE=location.origin+location.pathname;
// 答えくらべ：リンクに「名前」と「お題ID.選んだ番号」を入れて送る（サーバーには何も足さない）
//   ?cn=けんじ&ca=fd8c73a6ba124536.1~5023b235ec2e4a8d.0~…
const CMP_MAX=10,CMP_MIN=5;
st.cmp=(()=>{const q=new URLSearchParams(location.search),a=q.get("ca");if(!a)return null;
  const list=a.split("~").map(x=>{const k=x.lastIndexOf(".");return[x.slice(0,k),+x.slice(k+1)]}).filter(([id,c])=>/^[A-Za-z0-9_-]{4,64}$/.test(id)&&Number.isInteger(c)&&c>=0).slice(0,CMP_MAX);
  return list.length?{name:(q.get("cn")||"ともだち").slice(0,12),list,seen:new Set(),fresh:new Set(),opened:false}:null})();
const myName=()=>{try{return localStorage.getItem("mataasobo-name")||""}catch(e){return""}};
const saveName=v=>{try{localStorage.setItem("mataasobo-name",v)}catch(e){}};
const linkFor=id=>BASE+"?q="+encodeURIComponent(id);

/* 匿名の投票者ID（ブラウザごと） */
const voter=(()=>{const mk=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");
  try{let v=localStorage.getItem("voter");if(!v){v=mk();localStorage.setItem("voter",v)}return v}catch(e){return mk()}})();

function tab(which){
  $("t-play").setAttribute("aria-selected",which==="play");$("t-make").setAttribute("aria-selected",which==="make");
  $("v-play").hidden=which!=="play";$("v-play").style.display=which==="play"?"flex":"none";$("v-make").hidden=which!=="make";
}
$("t-play").onclick=()=>tab("play");$("t-make").onclick=()=>tab("make");
function setSort(s){st.sort=s;document.querySelectorAll("#sorts .pill").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===s));render()}
document.querySelectorAll("#sorts .pill").forEach(b=>b.onclick=()=>setSort(b.dataset.s));
function notice(t){$("notice").hidden=!t;$("notice").textContent=t||""}
function ago(ms){const s=(Date.now()-ms)/1000;if(s<60)return"たった今";if(s<3600)return Math.floor(s/60)+"分前";if(s<86400)return Math.floor(s/3600)+"時間前";return Math.floor(s/86400)+"日前"}

/* 読み込み */
async function load(){
  try{
    const r=await fetch(API+"/questions?voter="+voter);if(!r.ok)throw 0;
    const d=await r.json();st.questions=d.questions;
    if(!voting)st.mine={...d.mine,...pendingMine};
    notice("");render();
  }catch(e){if(!st.questions.length)$("feed").innerHTML='<div class="empty"><b>読み込めませんでした</b><span class="sub">通信状況を確認して、ページを開き直してください。</span></div>'}
}

function render(){
  const feed=$("feed");
  document.querySelector("#v-play .bar-row").style.display=st.cmp?"none":""; // 答えくらべの間は、並べかえを隠す
  if(st.cmp){renderCmp(feed);return}
  let qs=st.questions.map(q=>({q,n:q.counts.reduce((a,b)=>a+b,0)}));
  if(st.sort==="todo")qs=qs.filter(x=>st.mine[x.q.id]===undefined||st.revealed.has(x.q.id));
  if(st.sort==="hot")qs.sort((a,b)=>b.n-a.n||b.q.createdAt-a.q.createdAt);
  else qs.sort((a,b)=>b.q.createdAt-a.q.createdAt);
  const answered=st.questions.filter(q=>st.mine[q.id]!==undefined).length;
  $("count").textContent=st.questions.length?`${answered} / ${st.questions.length} 問に回答済み`:"";
  feed.innerHTML="";
  const fq=st.focus&&st.questions.find(q=>q.id===st.focus);
  if(st.focus&&st.questions.length&&!fq){st.focus=null;history.replaceState(null,"",BASE)}
  if(fq){
    const head=document.createElement("div");head.className="focus-head";
    head.innerHTML='<span>シェアされたお題</span>';
    const more=document.createElement("button");more.type="button";more.className="pill";more.textContent="ほかのお題も答える";
    more.onclick=()=>{st.focus=null;history.replaceState(null,"",BASE);render();window.scrollTo({top:0})};
    head.appendChild(more);feed.appendChild(head);
    const c=card(fq,fq.counts.reduce((a,b)=>a+b,0));c.classList.add("focus");feed.appendChild(c);
    if(st.mine[fq.id]===undefined)return;   // 答えるまではこの1問だけ
    qs=qs.filter(x=>x.q.id!==fq.id);
    const h=document.createElement("div");h.className="focus-head";h.innerHTML="<span>ほかのお題</span>";feed.appendChild(h);
  }
  if(!qs.length&&fq)return;
  if(!fq)feed.appendChild(cmpMaker(answered));
  if(!qs.length){
    feed.innerHTML=st.questions.length
      ?'<div class="empty"><b>ぜんぶ答えました</b><span class="sub">「新着」や「人気」で結果を見返せます。新しいお題を作るのもアリ。</span><button class="btn" type="button" id="goMake">お題をつくる</button></div>'
      :'<div class="empty"><b>まだお題がありません</b><span class="sub">最初のお題を作ってみよう。</span><button class="btn" type="button" id="goMake">お題をつくる</button></div>';
    $("goMake").onclick=()=>tab("make");feed.prepend(cmpMaker(answered));return;
  }
  for(const x of qs)feed.appendChild(card(x.q,x.n));
}
function card(q,n,other){ // other：答えくらべの相手 {name, pick}（自分が答えてから見せる）
  const el=document.createElement("article");el.className="card";
  const myPick=st.mine[q.id];const shown=myPick!==undefined;
  el.innerHTML=`<div class="qmeta"><span>${q.choices.length}択</span><span class="right"><span>${ago(q.createdAt)}</span></span></div><p class="qtext"></p><div class="choices"></div>`;
  el.querySelector(".qtext").textContent=q.text;
  addReport(el,q);
  const box=el.querySelector(".choices");const max=Math.max(...q.counts);
  q.choices.forEach((label,i)=>{
    const b=document.createElement("button");b.type="button";b.className="ch"+(shown&&myPick===i?" mine":"");
    b.style.setProperty("--c",`var(${COLORS[i%6]})`);
    const pct=n?Math.round(q.counts[i]/n*100):0;
    b.innerHTML=`<span class="fill"></span><span class="dot"></span><span class="lbl"></span>${shown&&myPick===i?'<span class="you">あなた</span>':""}${shown&&other&&other.pick===i?`<span class="them"></span>`:""}${shown?`<span class="pct">${pct}%</span>`:""}`;
    if(shown&&other&&other.pick===i)b.querySelector(".them").textContent=other.name;
    b.querySelector(".lbl").textContent=label;
    if(shown)requestAnimationFrame(()=>b.querySelector(".fill").style.width=pct+"%");
    b.setAttribute("aria-label",shown?`${label}、${pct}%`:label);
    b.onclick=()=>vote(q,i);
    box.appendChild(b);
  });
  if(shown){
    const nt=document.createElement("div");nt.className="done-note";
    const tag=n&&q.counts[myPick]===max?(q.counts.filter(v=>v===max).length>1?"同率トップ":"多数派"):n?"少数派":"";
    nt.textContent=`${n}人が回答 ・ あなたは${tag}`;el.appendChild(nt);
    if(!other)el.appendChild(shareRow(q,myPick,n?Math.round(q.counts[myPick]/n*100):0,tag));
  }
  return el;
}

/* 答えくらべ */
// ふつうの画面のいちばん上：自分の答えからリンクをつくる箱
function cmpMaker(answered){
  const box=document.createElement("section");box.className="cmpbox";box.setAttribute("aria-label","友達と答えくらべ");
  const need=Math.max(0,CMP_MIN-answered);
  box.innerHTML=`<h2>🤝 友達と答えくらべ</h2><p>答えたお題から${CMP_MAX}問をリンクにして友達に送ると、友達が同じお題に答えて「ふたりの一致率」が出ます。</p>`
    +(need?`<p><b>あと${need}問</b>答えるとつくれます。</p>`
      :`<div class="cmprow"><input type="text" id="cmpName" maxlength="12" placeholder="あなたの名前" aria-label="あなたの名前"><button class="btn" type="button" id="cmpMake">リンクをつくる</button></div><div id="cmpOut"></div>`);
  if(!need){
    const inp=box.querySelector("#cmpName");inp.value=myName();
    box.querySelector("#cmpMake").onclick=()=>{const name=inp.value.trim()||"ともだち";saveName(name);showCmpLink(box.querySelector("#cmpOut"),name)};
  }
  return box;
}
function cmpLinkFor(name){
  // 答えたお題のうち、答えた人が多いものから（割合が見ごたえある）
  const qs=st.questions.filter(q=>st.mine[q.id]!==undefined).sort((a,b)=>b.counts.reduce((x,y)=>x+y,0)-a.counts.reduce((x,y)=>x+y,0)||b.createdAt-a.createdAt).slice(0,CMP_MAX);
  return{url:BASE+"?cn="+encodeURIComponent(name)+"&ca="+qs.map(q=>q.id+"."+st.mine[q.id]).join("~"),n:qs.length};
}
function showCmpLink(out,name){
  const {url,n}=cmpLinkFor(name);gtag("event","cmp_create",{n});
  const msg=`「みんなの〇択」で答えくらべしよう！ ${n}問、私と何問同じになるかな？`;
  out.innerHTML=`<p class="cmplink"></p><div class="share"></div>`;out.querySelector(".cmplink").textContent=url;
  const row=out.querySelector(".share");
  const line=document.createElement("a");line.href="https://line.me/R/share?text="+encodeURIComponent(msg+" "+url);line.target="_blank";line.rel="noopener";line.textContent="LINEで送る";row.appendChild(line);
  const x=document.createElement("a");x.className="x";x.target="_blank";x.rel="noopener";x.href="https://x.com/intent/post?text="+encodeURIComponent(msg)+"&url="+encodeURIComponent(url)+"&hashtags="+encodeURIComponent("みんなの〇択");x.textContent="Xで送る";row.appendChild(x);
  if(navigator.share){const sh=document.createElement("button");sh.type="button";sh.textContent="ほかのアプリで送る";sh.onclick=()=>navigator.share({title:"みんなの〇択",text:msg,url}).catch(()=>{});row.appendChild(sh)}
  const cp=document.createElement("button");cp.type="button";cp.textContent="リンクをコピー";
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(url);cp.textContent="コピーしました"}catch(e){prompt("このリンクをコピーしてください",url)}setTimeout(()=>cp.textContent="リンクをコピー",2000)};row.appendChild(cp);
}
// 答えくらべのリンクを開いた人：同じお題に1問ずつ答え、答えるたびに相手の答えと一致したかを見せる。最後に一致率
function renderCmp(feed){
  const c=st.cmp;feed.innerHTML="";
  if(!st.questions.length){feed.innerHTML='<div class="empty"><b>読み込み中…</b></div>';return}
  const items=c.list.map(([id,pick])=>({q:st.questions.find(x=>x.id===id),pick})).filter(x=>x.q&&x.pick<x.q.choices.length);
  if(!c.opened){c.opened=true;gtag("event","cmp_open",{n:items.length});
    items.forEach(x=>{if(st.mine[x.q.id]!==undefined&&!c.fresh.has(x.q.id))c.seen.add(x.q.id)})} // 前に答えたお題は、その答えでくらべる
  const head=document.createElement("div");head.className="cmpbox";
  head.innerHTML=`<h2></h2><p>${Math.min(c.seen.size,items.length)} / ${items.length} 問　答えるたびに、相手と同じだったかがわかります。</p>`;
  head.querySelector("h2").textContent=`🤝 ${c.name}さんと答えくらべ`;feed.appendChild(head);
  if(!items.length){feed.insertAdjacentHTML("beforeend",'<div class="empty"><b>お題が見つかりませんでした</b><span class="sub">お題が消されたのかもしれません。</span></div>');feed.appendChild(exitBtn());return}
  const cur=items.find(x=>!c.seen.has(x.q.id));
  if(cur){
    const n=cur.q.counts.reduce((a,b)=>a+b,0),answered=st.mine[cur.q.id]!==undefined;
    const el=card(cur.q,n,answered?{name:c.name,pick:cur.pick}:null);feed.appendChild(el);
    if(answered){
      const same=st.mine[cur.q.id]===cur.pick;
      const m=document.createElement("p");m.className="match "+(same?"same":"diff");m.textContent=same?`🎉 ${c.name}さんと同じ！`:`${c.name}さんは「${cur.q.choices[cur.pick]}」でした`;
      el.insertBefore(m,el.querySelector(".choices"));
      const nx=document.createElement("button");nx.className="btn";nx.type="button";nx.textContent=items.filter(x=>!c.seen.has(x.q.id)).length>1?"次のお題へ":"結果を見る";
      nx.onclick=()=>{c.seen.add(cur.q.id);render();window.scrollTo({top:0})};el.appendChild(nx);
    }
    return;
  }
  // 結果
  const same=items.filter(x=>st.mine[x.q.id]===x.pick),rate=Math.round(same.length/items.length*100);
  if(!c.doneSent){c.doneSent=true;gtag("event","cmp_done",{rate,n:items.length})}
  const word=rate>=90?"以心伝心！":rate>=70?"気が合うふたり":rate>=40?"ほどよく似てる":"正反対だからおもしろい";
  const res=document.createElement("article");res.className="card";
  res.innerHTML=`<p class="match">${c.name.replace(/[<>&"]/g,"")}さんとの一致率</p><p class="rate">${rate}%</p><p class="match">${word}</p><p class="sub" style="text-align:center">${items.length}問中 ${same.length}問が同じでした</p>`;
  const diff=items.filter(x=>st.mine[x.q.id]!==x.pick);
  if(diff.length){const ul=document.createElement("ul");ul.className="difflist";
    for(const x of diff){const li=document.createElement("li");const b=document.createElement("b");b.textContent=x.q.text;li.appendChild(b);
      li.appendChild(document.createTextNode(`あなた：${x.q.choices[st.mine[x.q.id]]}　／　${c.name}：${x.q.choices[x.pick]}`));ul.appendChild(li)}
    const h=document.createElement("p");h.className="f";h.textContent="ちがったお題";res.appendChild(h);res.appendChild(ul)}
  const row=document.createElement("div");row.className="share";
  const x=document.createElement("a");x.className="x";x.target="_blank";x.rel="noopener";
  x.href="https://x.com/intent/post?text="+encodeURIComponent(`${c.name}さんとの答えくらべ、一致率${rate}%（${word}）でした！`)+"&url="+encodeURIComponent(BASE)+"&hashtags="+encodeURIComponent("みんなの〇択");
  x.textContent="結果をXでシェア";row.appendChild(x);res.appendChild(row);
  feed.appendChild(res);
  // 自分のリンクをつくって送り返す
  const back=cmpMaker(st.questions.filter(q=>st.mine[q.id]!==undefined).length);back.querySelector("h2").textContent="🤝 こんどはあなたのリンクを送ろう";feed.appendChild(back);
  feed.appendChild(exitBtn());
}
function exitBtn(){const b=document.createElement("button");b.type="button";b.className="pill";b.textContent="ほかのお題も答える";
  b.onclick=()=>{st.cmp=null;history.replaceState(null,"",BASE);render();window.scrollTo({top:0})};return b}

/* シェア */
function shareRow(q,pick,pct,tag){
  const url=linkFor(q.id);
  const msg=`「${q.text}」\n私は「${q.choices[pick]}」で${tag||"一番乗り"}${tag?`（${pct}%）`:""}でした。あなたは？`;
  const row=document.createElement("div");row.className="share";
  const x=document.createElement("a");x.className="x";x.target="_blank";x.rel="noopener";
  x.href="https://x.com/intent/post?text="+encodeURIComponent(msg)+"&url="+encodeURIComponent(url)+"&hashtags="+encodeURIComponent("みんなの〇択");
  x.textContent="Xでシェア";row.appendChild(x);
  if(navigator.share){
    const sh=document.createElement("button");sh.type="button";sh.textContent="ほかのアプリで送る";
    sh.onclick=()=>navigator.share({title:"みんなの〇択",text:msg,url}).catch(()=>{});row.appendChild(sh);
  }
  const cp=document.createElement("button");cp.type="button";cp.textContent="リンクをコピー";
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(url);cp.textContent="コピーしました"}catch(e){prompt("このリンクをコピーしてください",url)}setTimeout(()=>cp.textContent="リンクをコピー",2000)};
  row.appendChild(cp);
  return row;
}

/* 通報 */
const reported=(()=>{try{return new Set(JSON.parse(localStorage.getItem("reported")||"[]"))}catch(e){return new Set()}})();
function saveReported(){try{localStorage.setItem("reported",JSON.stringify([...reported].slice(-500)))}catch(e){}}
function addReport(el,q){
  const right=el.querySelector(".qmeta .right");
  if(reported.has(q.id)){const t=document.createElement("span");t.textContent="通報済み";right.appendChild(t);return}
  const b=document.createElement("button");b.type="button";b.className="rep";b.textContent="通報";
  b.setAttribute("aria-label","このお題を通報する");
  b.onclick=()=>{
    if(el.querySelector(".repbox"))return;
    const box=document.createElement("div");box.className="repbox";
    box.innerHTML='<b>悪口・個人情報・不快な内容などを含むお題として通報しますか？</b><button type="button" class="go">通報する</button><button type="button" class="no">やめる</button>';
    box.querySelector(".no").onclick=()=>box.remove();
    box.querySelector(".go").onclick=async()=>{
      box.querySelectorAll("button").forEach(x=>x.disabled=true);
      try{
        const r=await fetch(API+"/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({questionId:q.id})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(d.error||"通報できませんでした。");
        reported.add(q.id);saveReported();
        box.innerHTML="<b>通報しました。ありがとうございます。何件か通報が集まると自動で非表示になります。</b>";
        b.replaceWith(Object.assign(document.createElement("span"),{textContent:"通報済み"}));
        setTimeout(()=>box.remove(),4000);
      }catch(e){box.querySelector("b").textContent=e.message||"通報できませんでした。";box.querySelectorAll("button").forEach(x=>x.disabled=false)}
    };
    el.querySelector(".qtext").after(box);
  };
  right.appendChild(b);
}

/* 投票：画面は先に更新し、集計はサーバーの返事で反映 */
let voting=0;const pendingMine={};
async function vote(q,i){
  const prev=st.mine[q.id];if(prev===i)return;
  if(prev!==undefined)q.counts[prev]--;q.counts[i]++;
  st.mine={...st.mine,[q.id]:i};pendingMine[q.id]=i;st.revealed.add(q.id);if(st.cmp)st.cmp.fresh.add(q.id);gtag("event","vote",{cmp:!!st.cmp});render();
  voting++;
  try{const r=await fetch(API+"/vote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({questionId:q.id,choice:i,voter})});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"投票を保存できませんでした。");delete pendingMine[q.id]}
  catch(e){notice(e.message||"投票を保存できませんでした。もう一度押してください。");q.counts[i]--;if(prev!==undefined)q.counts[prev]++;
    const m={...st.mine};if(prev===undefined)delete m[q.id];else m[q.id]=prev;st.mine=m;delete pendingMine[q.id];render()}
  finally{voting--}
}

/* お題づくり */
let opts=["",""];
const EX=["例：ナイフ","例：スマホ（圏外）","例：漫画全巻","例：親友","例：毛布","例：調味料セット"];
function renderOpts(){
  const box=$("opts");box.innerHTML="";
  opts.forEach((v,i)=>{
    const row=document.createElement("div");row.className="opt";row.style.setProperty("--c",`var(${COLORS[i]})`);
    row.innerHTML=`<span class="dot"></span><input type="text" id="opt${i}" maxlength="30" aria-label="選択肢${i+1}"><button class="x" type="button" aria-label="選択肢${i+1}を消す">×</button>`;
    const inp=row.querySelector("input");inp.value=v;inp.placeholder=EX[i];inp.oninput=()=>{opts[i]=inp.value};
    const x=row.querySelector(".x");x.disabled=opts.length<=2;x.onclick=()=>{opts.splice(i,1);renderOpts()};
    box.appendChild(row);
  });
  $("addopt").hidden=opts.length>=6;
}
$("addopt").onclick=()=>{opts.push("");renderOpts();$("opt"+(opts.length-1)).focus()};
$("qin").oninput=()=>$("qlen").textContent=`${$("qin").value.length} / 80`;
function mstatus(kind,text){const s=$("mstatus");s.hidden=!text;s.className="status "+(kind||"");s.textContent=text||""}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("qin").value.trim();const choices=opts.map(o=>o.trim()).filter(Boolean);
  if(!text){mstatus("ng","質問を入れてください。");return}
  if(choices.length<2){mstatus("ng","選択肢を2つ以上入れてください。");return}
  if(new Set(choices).size!==choices.length){mstatus("ng","同じ選択肢が重なっています。");return}
  const btn=$("send");btn.disabled=true;mstatus("","AIがチェック中…");
  try{
    const r=await fetch(API+"/questions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,choices})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){mstatus("ng",d.error||"投稿できませんでした。もう一度送ってください。");return}
    if(!d.ok){mstatus("ng",d.reason||"この内容は載せられません。表現を変えてみてください。");return}
    mstatus("ok","投稿しました。自分でも答えてみよう。");
    $("qin").value="";$("qlen").textContent="0 / 80";opts=["",""];renderOpts();
    st.focus=d.id;history.replaceState(null,"",linkFor(d.id));
    await load();setSort("new");setTimeout(()=>{tab("play");mstatus("","")},900);
  }catch(err){mstatus("ng","通信に失敗しました。もう一度送ってください。")}
  finally{btn.disabled=false}
});

renderOpts();load();
setInterval(()=>{if(!document.hidden&&!voting&&!document.querySelector(".repbox"))load()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
