<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなの〇択</title>
<meta name="description" content="正解のない質問に答えて、みんながどれを選んだか見てみよう。お題は誰でも作れます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: a single column "投票用紙" feed — each お題 is a slip; picking reveals the tally as colored bars. Compose sheet lives in a second tab. */
:root{
  --bg:#eceef5; --sheet:#ffffff; --ink:#1b2033; --soft:#5b6380; --line:#d3d7e6;
  --accent:#2f54eb; --on-accent:#ffffff; --warn:#c7372f;
  --c1:#2f54eb; --c2:#e8590c; --c3:#0c9b6b; --c4:#b23ad1; --c5:#d6a20b; --c6:#e0457b;
  --display:"RocknRoll One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151f; --sheet:#1d2130; --ink:#eef0f8; --soft:#9aa1bd; --line:#33384d;
  --accent:#7d97ff; --on-accent:#0f1222; --warn:#ff7b72;
  --c1:#7d97ff; --c2:#ff8c4a; --c3:#3fd0a0; --c4:#d47ff0; --c5:#f2c94c; --c6:#ff7aa6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151f; --sheet:#1d2130; --ink:#eef0f8; --soft:#9aa1bd; --line:#33384d;
  --accent:#7d97ff; --on-accent:#0f1222; --warn:#ff7b72;
  --c1:#7d97ff; --c2:#ff8c4a; --c3:#3fd0a0; --c4:#d47ff0; --c5:#f2c94c; --c6:#ff7aa6; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.6}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,10vw,3rem);line-height:1.05;margin:0}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0;color:var(--soft);font-size:.95rem}
.tabs{display:flex;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;font:inherit;font-weight:700;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--soft);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:flex;gap:4px}
.pill{font:inherit;font-size:.85rem;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--soft);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.count{font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--soft);letter-spacing:.04em}
.qtext{font-weight:900;font-size:1.2rem;line-height:1.45;margin:0;text-wrap:balance;word-break:break-word}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{position:relative;overflow:hidden;font:inherit;font-weight:700;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.ch:hover{border-color:var(--c)}
.ch .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.ch .lbl{flex:1;min-width:0;word-break:break-word;position:relative}
.ch .pct{flex:none;font-variant-numeric:tabular-nums;font-weight:900;position:relative}
.ch .fill{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.16;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ch.mine{border-color:var(--c)}
.ch.mine .fill{opacity:.28}
.ch .you{font-size:.72rem;font-weight:900;color:var(--c);letter-spacing:.06em;position:relative;flex:none}
.done-note{font-size:.85rem;color:var(--soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.linkbtn{font:inherit;font-size:.82rem;background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;padding:0}
.empty{background:var(--sheet);border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--display);font-weight:400;font-size:1.3rem}
/* compose */
form{display:flex;flex-direction:column;gap:14px}
.f{font-size:.8rem;font-weight:900;color:var(--soft);letter-spacing:.08em}
textarea,input[type=text]{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:4.2em;font-size:1.05rem}
.opt{display:flex;gap:8px;align-items:center}
.opt .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.x{flex:none;width:38px;height:38px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--soft);font:inherit;font-size:1rem;cursor:pointer}
.x:disabled{opacity:.35;cursor:default}
.btn{font-family:var(--display);font-weight:400;font-size:1.1rem;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.ghost{font:inherit;font-weight:700;padding:9px 12px;border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--soft);cursor:pointer}
.hint{font-size:.8rem;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.status{font-size:.92rem;border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;gap:8px}
.status.ng{color:var(--warn)}
.status.ok{color:var(--c3)}
.notice{font-size:.85rem;color:var(--soft);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ch .fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>みんなの<em>〇</em>択</h1>
    <p class="sub">正解のない質問に答えて、みんながどれを選んだか見てみよう。お題は誰でも作れます。</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-play" aria-selected="true" type="button">答える</button>
    <button class="tab" role="tab" id="t-make" aria-selected="false" type="button">お題をつくる</button>
  </div>

  <div id="notice" class="notice" hidden></div>

  <section id="v-play" style="display:flex;flex-direction:column;gap:14px">
    <div class="bar-row">
      <div class="seg" id="sorts">
        <button class="pill" type="button" data-s="todo" aria-pressed="true">まだ答えてない</button>
        <button class="pill" type="button" data-s="new" aria-pressed="false">新着</button>
        <button class="pill" type="button" data-s="hot" aria-pressed="false">人気</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="feed" id="feed">
      <div class="empty"><b>読み込み中…</b></div>
    </div>
  </section>

  <section id="v-make" hidden>
    <div class="card">
      <form id="form" novalidate>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label class="f" for="qin">質問</label>
          <textarea id="qin" maxlength="80" placeholder="例：無人島にひとつだけ持っていくなら？"></textarea>
          <div class="hint" id="qlen">0 / 80</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="f">選択肢（2〜6個）</span>
          <div id="opts" style="display:flex;flex-direction:column;gap:8px"></div>
          <button class="ghost" type="button" id="addopt">＋ 選択肢をふやす</button>
        </div>
        <div id="mstatus" class="status" hidden></div>
        <button class="btn" type="submit" id="send">AIにチェックしてもらって投稿</button>
        <p class="sub" style="font-size:.82rem">投稿前に、質問と選択肢をAIが確認します。悪口・個人情報・性的な内容・意味のない文字列などは載せられません。</p>
      </form>
    </div>
  </section>
</div>

<script>
/* ↓ Supabase の Edge Function の URL に書き換える（末尾の / なし） */
const API="https://bhnkfafrnrddtkdkwvso.supabase.co/functions/v1/minna";

const COLORS=["--c1","--c2","--c3","--c4","--c5","--c6"];
const $=id=>document.getElementById(id);
const st={questions:[],mine:{},sort:"todo",revealed:new Set()};

/* 匿名の投票者ID（ブラウザごと） */
const voter=(()=>{const mk=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");
  try{let v=localStorage.getItem("voter");if(!v){v=mk();localStorage.setItem("voter",v)}return v}catch(e){return mk()}})();

function tab(which){
  $("t-play").setAttribute("aria-selected",which==="play");$("t-make").setAttribute("aria-selected",which==="make");
  $("v-play").hidden=which!=="play";$("v-play").style.display=which==="play"?"flex":"none";$("v-make").hidden=which!=="make";
}
$("t-play").onclick=()=>tab("play");$("t-make").onclick=()=>tab("make");
function setSort(s){st.sort=s;document.querySelectorAll("#sorts .pill").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===s));render()}
document.querySelectorAll("#sorts .pill").forEach(b=>b.onclick=()=>setSort(b.dataset.s));
function notice(t){$("notice").hidden=!t;$("notice").textContent=t||""}
function ago(ms){const s=(Date.now()-ms)/1000;if(s<60)return"たった今";if(s<3600)return Math.floor(s/60)+"分前";if(s<86400)return Math.floor(s/3600)+"時間前";return Math.floor(s/86400)+"日前"}

/* 読み込み */
async function load(){
  try{
    const r=await fetch(API+"/questions?voter="+voter);if(!r.ok)throw 0;
    const d=await r.json();st.questions=d.questions;
    if(!voting)st.mine={...d.mine,...pendingMine};
    notice("");render();
  }catch(e){if(!st.questions.length)$("feed").innerHTML='<div class="empty"><b>読み込めませんでした</b><span class="sub">通信状況を確認して、ページを開き直してください。</span></div>'}
}

function render(){
  const feed=$("feed");
  let qs=st.questions.map(q=>({q,n:q.counts.reduce((a,b)=>a+b,0)}));
  if(st.sort==="todo")qs=qs.filter(x=>st.mine[x.q.id]===undefined||st.revealed.has(x.q.id));
  if(st.sort==="hot")qs.sort((a,b)=>b.n-a.n||b.q.createdAt-a.q.createdAt);
  else qs.sort((a,b)=>b.q.createdAt-a.q.createdAt);
  const answered=st.questions.filter(q=>st.mine[q.id]!==undefined).length;
  $("count").textContent=st.questions.length?`${answered} / ${st.questions.length} 問に回答済み`:"";
  feed.innerHTML="";
  if(!qs.length){
    feed.innerHTML=st.questions.length
      ?'<div class="empty"><b>ぜんぶ答えました</b><span class="sub">「新着」や「人気」で結果を見返せます。新しいお題を作るのもアリ。</span><button class="btn" type="button" id="goMake">お題をつくる</button></div>'
      :'<div class="empty"><b>まだお題がありません</b><span class="sub">最初のお題を作ってみよう。</span><button class="btn" type="button" id="goMake">お題をつくる</button></div>';
    $("goMake").onclick=()=>tab("make");return;
  }
  for(const x of qs)feed.appendChild(card(x.q,x.n));
}
function card(q,n){
  const el=document.createElement("article");el.className="card";
  const myPick=st.mine[q.id];const shown=myPick!==undefined;
  el.innerHTML=`<div class="qmeta"><span>${q.choices.length}択</span><span>${ago(q.createdAt)}</span></div><p class="qtext"></p><div class="choices"></div>`;
  el.querySelector(".qtext").textContent=q.text;
  const box=el.querySelector(".choices");const max=Math.max(...q.counts);
  q.choices.forEach((label,i)=>{
    const b=document.createElement("button");b.type="button";b.className="ch"+(shown&&myPick===i?" mine":"");
    b.style.setProperty("--c",`var(${COLORS[i%6]})`);
    const pct=n?Math.round(q.counts[i]/n*100):0;
    b.innerHTML=`<span class="fill"></span><span class="dot"></span><span class="lbl"></span>${shown&&myPick===i?'<span class="you">あなた</span>':""}${shown?`<span class="pct">${pct}%</span>`:""}`;
    b.querySelector(".lbl").textContent=label;
    if(shown)requestAnimationFrame(()=>b.querySelector(".fill").style.width=pct+"%");
    b.setAttribute("aria-label",shown?`${label}、${pct}%`:label);
    b.onclick=()=>vote(q,i);
    box.appendChild(b);
  });
  if(shown){
    const nt=document.createElement("div");nt.className="done-note";
    const tag=n&&q.counts[myPick]===max?(q.counts.filter(v=>v===max).length>1?"同率トップ":"多数派"):n?"少数派":"";
    nt.textContent=`${n}人が回答 ・ あなたは${tag}`;el.appendChild(nt);
  }
  return el;
}

/* 投票：画面は先に更新し、集計はサーバーの返事で反映 */
let voting=0;const pendingMine={};
async function vote(q,i){
  const prev=st.mine[q.id];if(prev===i)return;
  if(prev!==undefined)q.counts[prev]--;q.counts[i]++;
  st.mine={...st.mine,[q.id]:i};pendingMine[q.id]=i;st.revealed.add(q.id);render();
  voting++;
  try{const r=await fetch(API+"/vote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({questionId:q.id,choice:i,voter})});
    const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"投票を保存できませんでした。");delete pendingMine[q.id]}
  catch(e){notice(e.message||"投票を保存できませんでした。もう一度押してください。");q.counts[i]--;if(prev!==undefined)q.counts[prev]++;
    const m={...st.mine};if(prev===undefined)delete m[q.id];else m[q.id]=prev;st.mine=m;delete pendingMine[q.id];render()}
  finally{voting--}
}

/* お題づくり */
let opts=["",""];
const EX=["例：ナイフ","例：スマホ（圏外）","例：漫画全巻","例：親友","例：毛布","例：調味料セット"];
function renderOpts(){
  const box=$("opts");box.innerHTML="";
  opts.forEach((v,i)=>{
    const row=document.createElement("div");row.className="opt";row.style.setProperty("--c",`var(${COLORS[i]})`);
    row.innerHTML=`<span class="dot"></span><input type="text" id="opt${i}" maxlength="30" aria-label="選択肢${i+1}"><button class="x" type="button" aria-label="選択肢${i+1}を消す">×</button>`;
    const inp=row.querySelector("input");inp.value=v;inp.placeholder=EX[i];inp.oninput=()=>{opts[i]=inp.value};
    const x=row.querySelector(".x");x.disabled=opts.length<=2;x.onclick=()=>{opts.splice(i,1);renderOpts()};
    box.appendChild(row);
  });
  $("addopt").hidden=opts.length>=6;
}
$("addopt").onclick=()=>{opts.push("");renderOpts();$("opt"+(opts.length-1)).focus()};
$("qin").oninput=()=>$("qlen").textContent=`${$("qin").value.length} / 80`;
function mstatus(kind,text){const s=$("mstatus");s.hidden=!text;s.className="status "+(kind||"");s.textContent=text||""}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("qin").value.trim();const choices=opts.map(o=>o.trim()).filter(Boolean);
  if(!text){mstatus("ng","質問を入れてください。");return}
  if(choices.length<2){mstatus("ng","選択肢を2つ以上入れてください。");return}
  if(new Set(choices).size!==choices.length){mstatus("ng","同じ選択肢が重なっています。");return}
  const btn=$("send");btn.disabled=true;mstatus("","AIがチェック中…");
  try{
    const r=await fetch(API+"/questions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,choices})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){mstatus("ng",d.error||"投稿できませんでした。もう一度送ってください。");return}
    if(!d.ok){mstatus("ng",d.reason||"この内容は載せられません。表現を変えてみてください。");return}
    mstatus("ok","投稿しました。自分でも答えてみよう。");
    $("qin").value="";$("qlen").textContent="0 / 80";opts=["",""];renderOpts();
    await load();setSort("new");setTimeout(()=>{tab("play");mstatus("","")},900);
  }catch(err){mstatus("ng","通信に失敗しました。もう一度送ってください。")}
  finally{btn.disabled=false}
});

renderOpts();load();
setInterval(()=>{if(!document.hidden&&!voting)load()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body>
</html>
