<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>みんなの〇択 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
html,body{margin:0}

/* Layout: a single column "投票用紙" feed — each お題 is a slip; picking reveals the tally as colored bars. Compose sheet lives in a second tab. */
:root{
  --bg:#eceef5; --sheet:#ffffff; --ink:#1b2033; --soft:#5b6380; --line:#d3d7e6;
  --accent:#2f54eb; --on-accent:#ffffff; --warn:#c7372f;
  --c1:#2f54eb; --c2:#e8590c; --c3:#0c9b6b; --c4:#b23ad1; --c5:#d6a20b; --c6:#e0457b;
  --display:"RocknRoll One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151f; --sheet:#1d2130; --ink:#eef0f8; --soft:#9aa1bd; --line:#33384d;
  --accent:#7d97ff; --on-accent:#0f1222; --warn:#ff7b72;
  --c1:#7d97ff; --c2:#ff8c4a; --c3:#3fd0a0; --c4:#d47ff0; --c5:#f2c94c; --c6:#ff7aa6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151f; --sheet:#1d2130; --ink:#eef0f8; --soft:#9aa1bd; --line:#33384d;
  --accent:#7d97ff; --on-accent:#0f1222; --warn:#ff7b72;
  --c1:#7d97ff; --c2:#ff8c4a; --c3:#3fd0a0; --c4:#d47ff0; --c5:#f2c94c; --c6:#ff7aa6; color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;line-height:1.6}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,10vw,3rem);line-height:1.05;margin:0}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0;color:var(--soft);font-size:.95rem}
.tabs{display:flex;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;font:inherit;font-weight:700;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--soft);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:flex;gap:4px}
.pill{font:inherit;font-size:.85rem;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--soft);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.count{font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--soft);letter-spacing:.04em}
.qtext{font-weight:900;font-size:1.2rem;line-height:1.45;margin:0;text-wrap:balance;word-break:break-word}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{position:relative;overflow:hidden;font:inherit;font-weight:700;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.ch:hover{border-color:var(--c)}
.ch .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
.ch .lbl{flex:1;min-width:0;word-break:break-word;position:relative}
.ch .pct{flex:none;font-variant-numeric:tabular-nums;font-weight:900;position:relative}
.ch .fill{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.16;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ch.mine{border-color:var(--c)}
.ch.mine .fill{opacity:.28}
.ch .you{font-size:.72rem;font-weight:900;color:var(--c);letter-spacing:.06em;position:relative;flex:none}
.done-note{font-size:.85rem;color:var(--soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qmeta .right{display:flex;gap:10px;align-items:center}
.rep{font:inherit;font-size:.75rem;background:none;border:0;color:var(--soft);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.rep:hover{color:var(--warn)}
.repbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;background:var(--bg);border-radius:10px;padding:10px 12px}
.repbox b{flex:1 1 12em;min-width:0}
.repbox button{font:inherit;font-weight:700;font-size:.82rem;padding:6px 12px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.repbox .go{background:var(--warn);border-color:var(--warn);color:#fff}
.linkbtn{font:inherit;font-size:.82rem;background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;padding:0}
.empty{background:var(--sheet);border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--display);font-weight:400;font-size:1.3rem}

.wrap{max-width:860px}
h1{font-size:clamp(1.6rem,7vw,2.2rem)}
.login{display:flex;gap:8px;flex-wrap:wrap}
.login input{flex:1 1 14em;min-width:0;font:inherit;font-weight:700;color:var(--ink);background:var(--sheet);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{font-family:var(--display);font-weight:400;font-size:1rem;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;min-width:7em}
.stat b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--soft)}
.stat.alert b{color:var(--warn)}
.row{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row.hid{opacity:.72;border-style:dashed}
.row .t{font-weight:900;font-size:1.05rem;word-break:break-word}
.row .c{font-size:.88rem;color:var(--soft);word-break:break-word}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums;align-items:center}
.chip{font-size:.72rem;font-weight:900;padding:2px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.04em}
.chip.live{color:var(--c3)} .chip.rep{color:var(--warn)} .chip.adm{color:var(--soft)}
.meta .warn{color:var(--warn);font-weight:900}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{font:inherit;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.acts .danger{color:var(--warn);border-color:var(--warn);background:transparent}
.acts .danger.armed{background:var(--warn);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.msg{font-size:.9rem;color:var(--warn)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>みんなの<em>〇</em>択 管理</h1>
    <p class="sub"><a href="./" style="color:inherit">サイトに戻る</a></p>
  </header>

  <form id="login" class="login" autocomplete="off">
    <input type="password" id="pw" placeholder="管理パスワード（ADMIN_KEY）" aria-label="管理パスワード" autocomplete="current-password">
    <button class="btn" type="submit">入る</button>
  </form>
  <p class="msg" id="msg" hidden></p>

  <section id="main" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="stats" id="stats"></div>
    <div class="bar-row">
      <div class="seg" id="filters">
        <button class="pill" type="button" data-f="check" aria-pressed="true">要確認</button>
        <button class="pill" type="button" data-f="hidden" aria-pressed="false">非表示</button>
        <button class="pill" type="button" data-f="all" aria-pressed="false">すべて</button>
      </div>
      <button class="pill" type="button" id="reload">更新</button>
    </div>
    <div class="list" id="list"></div>
    <button class="pill" type="button" id="logout" style="align-self:flex-start">ログアウト</button>
  </section>
</div>

<script>
const API="https://bhnkfafrnrddtkdkwvso.supabase.co/functions/v1/minna";
const $=id=>document.getElementById(id);
let key="";try{key=sessionStorage.getItem("adminKey")||""}catch(e){}
let data={questions:[],threshold:3},filter="check";

function msg(t){$("msg").hidden=!t;$("msg").textContent=t||""}
function when(ms){const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}

async function call(path,opt={}){
  const r=await fetch(API+"/admin/questions"+path,{...opt,headers:{"content-type":"application/json","x-admin-key":key}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||"失敗しました。");e.status=r.status;throw e}
  return d;
}
async function load(){
  try{data=await call("");msg("");$("login").hidden=true;$("main").hidden=false;$("main").style.display="flex";render()}
  catch(e){if(e.status===403||e.status===429){logout();msg(e.message)}else msg("読み込めませんでした。通信状況を確認してください。")}
}
function logout(){key="";try{sessionStorage.removeItem("adminKey")}catch(e){}$("login").hidden=false;$("main").hidden=true;$("main").style.display="none"}

function render(){
  const qs=data.questions;
  const live=qs.filter(q=>!q.hidden).length,hid=qs.length-live;
  const check=qs.filter(q=>(!q.hidden&&q.reports>0)||q.hiddenBy==="reports");
  $("stats").innerHTML="";
  [["公開中",live],["非表示",hid],["要確認",check.length,check.length>0],["総投票",qs.reduce((a,q)=>a+q.votes,0)]].forEach(([l,n,alert])=>{
    const d=document.createElement("div");d.className="stat"+(alert?" alert":"");d.innerHTML=`<b>${n}</b><span>${l}</span>`;$("stats").appendChild(d)});
  const shown=filter==="check"?check:filter==="hidden"?qs.filter(q=>q.hidden):qs;
  const list=$("list");list.innerHTML="";
  if(!shown.length){list.innerHTML=`<div class="empty"><b>${filter==="check"?"確認が必要なお題はありません":"該当するお題はありません"}</b></div>`;return}
  for(const q of shown)list.appendChild(row(q));
}
function row(q){
  const el=document.createElement("div");el.className="row"+(q.hidden?" hid":"");
  const chip=q.hidden?(q.hiddenBy==="reports"?'<span class="chip rep">通報で自動非表示</span>':'<span class="chip adm">非表示</span>'):'<span class="chip live">公開中</span>';
  el.innerHTML=`<div class="t"></div><div class="c"></div><div class="meta">${chip}<span>${when(q.createdAt)}</span><span>票 ${q.votes}</span><span class="${q.reports?"warn":""}">通報 ${q.reports}/${data.threshold}</span><span class="who"></span></div><div class="acts"></div>`;
  el.querySelector(".t").textContent=q.text;
  el.querySelector(".c").textContent=q.choices.join(" / ");
  el.querySelector(".who").textContent=q.poster?"投稿者 "+q.poster:"最初のお題";
  const acts=el.querySelector(".acts");
  const toggle=document.createElement("button");toggle.type="button";
  toggle.textContent=q.hidden?"表示に戻す（通報もリセット）":"非表示にする";
  toggle.onclick=async()=>{toggle.disabled=true;try{await call("/"+q.id,{method:"POST",body:JSON.stringify({hidden:!q.hidden})});await load()}catch(e){msg(e.message);toggle.disabled=false}};
  const del=document.createElement("button");del.type="button";del.className="danger";del.textContent="完全に削除";
  let armed=false,t=0;
  del.onclick=async()=>{
    if(!armed){armed=true;del.classList.add("armed");del.textContent="もう一度押すと削除（票も消えます）";t=setTimeout(()=>{armed=false;del.classList.remove("armed");del.textContent="完全に削除"},4000);return}
    clearTimeout(t);del.disabled=true;try{await call("/"+q.id,{method:"DELETE"});await load()}catch(e){msg(e.message);del.disabled=false}
  };
  acts.append(toggle,del);
  return el;
}

$("login").addEventListener("submit",e=>{e.preventDefault();key=$("pw").value.trim();if(!key)return;try{sessionStorage.setItem("adminKey",key)}catch(e){}$("pw").value="";load()});
document.querySelectorAll("#filters .pill").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("#filters .pill").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("reload").onclick=load;$("logout").onclick=logout;
if(key)load();
</script>
</body>
</html>
